<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>phil</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
    }

    .brand-spacer {
      display: none;
    }

    /* Side-by-side / 2+1 wrap: center tiles (and title above them) in the viewport */
    @media (min-width: 961px) {
      header {
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        grid-template-columns: 1fr;
        min-height: 100vh;
        padding-top: 0;
        padding-bottom: 0;
        box-sizing: border-box;
      }

      /*
        Equal spacers center the title. On expand, JS pins the top spacer
        height so the title stays put while the bottom spacer shrinks / the
        brand row grows and the tiles move down.
      */
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        align-self: stretch;
        height: 100%;
      }

      .brand-spacer {
        display: block;
        width: 100%;
        pointer-events: none;
        flex: 1 1 0;
        min-height: 0;
      }

      .brand-title {
        flex: 0 0 auto;
      }

      nav {
        margin-top: 0;
      }
    }

    header h1 {
      font-size: 2rem;
      font-weight: 400;
    }

    header h1 .brand-toggle {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      margin: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    header .about {
      max-width: 36rem;
      margin-top: 0.75rem;
      padding: 0 1rem;
      font-size: 1rem;
      line-height: 1.5;
    }

    header .about[hidden] {
      display: none;
    }

    header .about a,
    .corner-links a {
      color: #0645AD;
      text-decoration: none;
    }

    header .about a:hover .wikilink-label,
    .corner-links a:hover .wikilink-label {
      text-decoration: underline;
    }

    .corner-links {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      display: flex;
      gap: 1rem;
      font-size: 1rem;
      line-height: 1.5;
    }

    nav {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2rem;
      width: 100%;
      margin-top: 1rem;
    }

    .project-thumb {
      color: inherit;
      text-decoration: none;
      flex: 0 0 auto;
      width: min(100%, 440px);
    }

    .project-thumb:hover .thumbinner {
      border-color: #a2a9b1;
    }

    .thumb {
      margin: 0;
    }

    .thumbinner {
      border: 1px solid #c8ccd1;
      background: #f8f9fa;
      padding: 3px;
      display: flex;
      flex-direction: column;
      text-align: center;
      font-size: 94%;
      width: 100%;
      height: 300px;
    }

    @media (max-width: 960px) {
      nav {
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .corner-links {
        position: static;
        justify-content: center;
        margin: 1.5rem 0 2rem;
        padding: 0 1rem;
      }
    }

    @media (max-width: 520px) {
      .thumbinner {
        height: min(300px, 68vw);
      }
    }

    .thumbimage {
      display: block;
      flex: 1;
      background: transparent;
      line-height: 0;
      overflow: hidden;
    }

    .thumbimage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .thumbimage--emoji {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1;
      background: transparent;
    }

    .thumbimage--emoji .thumb-emoji {
      font-size: 4.5rem;
      line-height: 1;
    }

    .thumbimage--icon {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1;
      box-sizing: border-box;
    }

    .thumbimage--icon img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .thumbcaption {
      text-align: left;
      padding: 3px;
      line-height: 1.4;
      color: #202122;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-spacer brand-spacer--top" aria-hidden="true"></div>
      <div class="brand-title">
        <h1>
          <button type="button" class="brand-toggle" aria-expanded="false" aria-controls="about">phil</button>
        </h1>
        <p id="about" class="about" hidden>
          Creating, contributing to and shaping
          <a href="/worlding" target="_blank" rel="noopener">[[<span class="wikilink-label">Worlds</span>]]</a><br>
          across disciplines - rooted in a background in product design
        </p>
      </div>
      <div class="brand-spacer brand-spacer--bottom" aria-hidden="true"></div>
    </div>
    <nav aria-label="Projekte">
      <a href="/home" class="project-thumb">
        <figure class="thumb">
          <div class="thumbinner">
            <span class="thumbimage">
              <img src="/previews/home.webp" alt="" />
            </span>
            <figcaption class="thumbcaption">Home</figcaption>
          </div>
        </figure>
      </a>
      <a href="/archive" class="project-thumb">
        <figure class="thumb">
          <div class="thumbinner">
            <span class="thumbimage thumbimage--emoji" aria-hidden="true">
              <span class="thumb-emoji">📁</span>
            </span>
            <figcaption class="thumbcaption">Archive</figcaption>
          </div>
        </figure>
      </a>
      <a href="/ar-archive" class="project-thumb">
        <figure class="thumb">
          <div class="thumbinner">
            <span class="thumbimage thumbimage--icon">
              <img src="/previews/ar-archive.webp" alt="" />
            </span>
            <figcaption class="thumbcaption">AR Archive</figcaption>
          </div>
        </figure>
      </a>
    </nav>
  </header>
  <div class="corner-links">
    <a href="/cv" target="_blank" rel="noopener">[[<span class="wikilink-label">CV</span>]]</a>
    <a href="mailto:philippetoulabor@gmail.com">[[<span class="wikilink-label">contact</span>]]</a>
  </div>
  <script>
    (() => {
      const toggle = document.querySelector(".brand-toggle");
      const about = document.getElementById("about");
      const topSpacer = document.querySelector(".brand-spacer--top");
      const mq = window.matchMedia("(min-width: 961px)");
      if (!toggle || !about || !topSpacer) return;

      const unpinTitle = () => {
        topSpacer.style.flex = "";
      };

      toggle.addEventListener("click", () => {
        const open = about.hasAttribute("hidden");
        if (open && mq.matches) {
          topSpacer.style.flex = `0 0 ${topSpacer.offsetHeight}px`;
        }
        about.toggleAttribute("hidden", !open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        if (!open) unpinTitle();
      });

      mq.addEventListener("change", () => {
        if (!mq.matches || about.hasAttribute("hidden")) unpinTitle();
      });
      window.addEventListener("resize", () => {
        if (about.hasAttribute("hidden")) unpinTitle();
      });
    })();
  </script>
</body>
</html>
