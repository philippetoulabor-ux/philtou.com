<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>CV — phil</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
    }

    body:has(#gate[hidden]) {
      display: block;
      min-height: 0;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
    }

    /* Gate screen: title sits in the upper grid row. */
    body:not(:has(#gate[hidden])) > header {
      grid-row: 1;
      align-self: center;
      justify-self: center;
      padding: 0 1rem;
    }

    /* Only the gate-page title; unlocked content may include its own <header>. */
    body:has(#gate[hidden]) > header {
      display: none;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 400;
    }

    #gate {
      grid-row: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 20rem;
      margin: 0 auto;
      padding: 0 1rem 2rem;
    }

    #gate[hidden] {
      display: none;
    }

    #gate label {
      font-size: 1rem;
      color: #202122;
    }

    #gate .password-field {
      position: relative;
      width: 100%;
    }

    #gate input[type="password"],
    #gate input[type="text"] {
      width: 100%;
      padding: 0.5rem 2.5rem 0.5rem 0.65rem;
      font-size: 1rem;
      border: 1px solid #a2a9b1;
      border-radius: 2px;
      font-family: inherit;
    }

    #gate input[type="password"]:focus,
    #gate input[type="text"]:focus {
      outline: 2px solid #0645AD;
      outline-offset: 1px;
    }

    #gate button {
      padding: 0.45rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      color: #202122;
      border: 1px solid #a2a9b1;
      background: #f8f9fa;
      cursor: pointer;
      border-radius: 2px;
      -webkit-appearance: none;
      appearance: none;
    }

    #gate button:hover {
      background: #eaecf0;
    }

    #gate .toggle-password {
      position: absolute;
      right: 0.2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: none;
      background: transparent;
      color: #54595d;
    }

    #gate .toggle-password:hover {
      background: transparent;
      color: #202122;
    }

    #gate .toggle-password svg {
      width: 1.15rem;
      height: 1.15rem;
      display: block;
    }

    #gate .toggle-password .icon-hide {
      display: none;
    }

    #gate .toggle-password[aria-pressed="true"] .icon-show {
      display: none;
    }

    #gate .toggle-password[aria-pressed="true"] .icon-hide {
      display: block;
    }

    #gate-error {
      color: #b32424;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    #content:empty {
      display: none;
    }

    /* Helpers available inside unlocked content */
    #content .cv-pdf {
      width: min(100%, 52rem);
      margin: 1rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    #content .cv-pdf-page {
      position: relative;
      border: 1px solid #c8ccd1;
      background: #fff;
      overflow: hidden;
      max-width: 100%;
    }

    #content .cv-pdf-page canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #content .textLayer {
      position: absolute;
      left: 0;
      top: 0;
      overflow: clip;
      line-height: 1;
      text-align: initial;
      letter-spacing: normal;
      word-spacing: normal;
      text-size-adjust: none;
      -webkit-text-size-adjust: none;
      transform-origin: 0 0;
      z-index: 1;
      opacity: 1;
      caret-color: CanvasText;
      /* Only glyph spans are selectable — empty gaps must not own the selection. */
      user-select: none;
      -webkit-user-select: none;
    }

    #content .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      line-height: 1;
      user-select: text;
      -webkit-user-select: text;
    }

    #content .textLayer > :not(.markedContent),
    #content .textLayer .markedContent span:not(.markedContent) {
      z-index: 1;
    }

    #content .textLayer span.markedContent {
      top: 0;
      height: 0;
    }

    #content .textLayer br {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      overflow: hidden;
      color: transparent;
      pointer-events: none;
    }

    #content .textLayer span::selection {
      background: rgba(0, 0, 255, 0.25);
      background: color-mix(in srgb, AccentColor, transparent 75%);
      color: transparent;
    }

    #content .textLayer span::-moz-selection {
      background: rgba(0, 0, 255, 0.25);
      background: color-mix(in srgb, AccentColor, transparent 75%);
      color: transparent;
    }

    /* Hide Chrome’s left-edge selection bar from synthetic <br> EOLs. */
    #content .textLayer br::selection,
    #content .textLayer br::-moz-selection {
      background: transparent !important;
      color: transparent !important;
    }

    #content .textLayer .endOfContent {
      display: block;
      position: absolute;
      inset: 100% 0 0;
      z-index: 0;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }

    #content .textLayer.selecting .endOfContent {
      top: 0;
    }

    #content .cv-pdf-status {
      text-align: center;
      color: #54595d;
      padding: 2rem 0;
      font-size: 0.95rem;
    }

    #content .cv-downloads {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      padding: 0 1rem 2rem;
    }

    #content .cv-downloads a {
      color: #0645AD;
      text-decoration: none;
    }

    #content .cv-downloads a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>CV</h1>
  </header>
  <form id="gate" autocomplete="off">
    <label for="password">Password</label>
    <div class="password-field">
      <input id="password" name="password" type="password" autofocus required />
      <button
        type="button"
        class="toggle-password"
        id="toggle-password"
        aria-label="Show password"
        aria-controls="password"
        aria-pressed="false"
      >
        <svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3l18 18"/>
          <path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/>
          <path d="M9.9 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.4 18.4 0 0 1-3.2 4.1"/>
          <path d="M6.1 6.1A18.5 18.5 0 0 0 2 12s3.5 7 10 7a10.3 10.3 0 0 0 4.1-.8"/>
        </svg>
      </button>
    </div>
    <button type="submit">Enter</button>
    <p id="gate-error" role="alert" aria-live="polite"></p>
  </form>
  <div id="content" hidden></div>
  <script type="module">
    const SESSION_KEY = "cv-unlocked";
    const ASSET_PREFIX = "asset:";
    const gate = document.getElementById("gate");
    const content = document.getElementById("content");
    const errorEl = document.getElementById("gate-error");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");

    togglePassword.addEventListener("click", () => {
      const showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      togglePassword.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      togglePassword.setAttribute("aria-pressed", showing ? "false" : "true");
      passwordInput.focus();
    });

    /** @type {Map<string, string>} */
    const blobUrls = new Map();

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function deriveKey(password, salt, iterations) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decryptBytes(key, ivB64, ciphertextBytes) {
      const iv = b64ToBytes(ivB64);
      return crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertextBytes);
    }

    async function loadPayload() {
      const res = await fetch("/cv/payload.json");
      if (!res.ok) throw new Error("payload missing");
      return res.json();
    }

    let payloadPromise = loadPayload();

    function revokeBlobs() {
      for (const url of blobUrls.values()) URL.revokeObjectURL(url);
      blobUrls.clear();
    }

    function rewriteAssetRefs(rootEl) {
      const attrs = ["src", "href", "data", "data-pdf"];
      rootEl.querySelectorAll("*").forEach((el) => {
        for (const attr of attrs) {
          const val = el.getAttribute(attr);
          if (!val || !val.startsWith(ASSET_PREFIX)) continue;
          const name = val.slice(ASSET_PREFIX.length);
          const url = blobUrls.get(name);
          if (!url) continue;
          el.setAttribute(attr, url);
          if (attr === "href" && !el.hasAttribute("download")) {
            el.setAttribute("download", name.split("/").pop());
          }
        }
      });
    }

    const PDFJS_MAIN = "/cv/vendor/pdf.min.mjs";
    const PDFJS_WORKER = "/cv/vendor/pdf.worker.min.mjs";
    /** Canvas pixels per CSS pixel — higher = sharper type, more memory. */
    const PDF_OUTPUT_SCALE = 4;

    let pdfjsPromise = null;
    function loadPdfjs() {
      if (!pdfjsPromise) {
        pdfjsPromise = import(PDFJS_MAIN).then((pdfjs) => {
          pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
          return pdfjs;
        });
      }
      return pdfjsPromise;
    }

    /** @type {Map<HTMLElement, HTMLElement>} */
    const textLayerEnds = new Map();
    let textLayerSelectionAbort = null;

    function resetTextLayerSelection(end, textLayerDiv) {
      textLayerDiv.append(end);
      end.style.width = "";
      end.style.height = "";
      textLayerDiv.classList.remove("selecting");
      textLayerDiv.querySelectorAll("span").forEach((span) => {
        span.style.pointerEvents = "";
      });
    }

    function enableTextLayerSelection() {
      if (textLayerSelectionAbort) return;
      textLayerSelectionAbort = new AbortController();
      const { signal } = textLayerSelectionAbort;
      let isPointerDown = false;
      let isFirefox;
      let prevRange = null;

      document.addEventListener("pointerdown", () => {
        isPointerDown = true;
      }, { signal });
      document.addEventListener("pointerup", () => {
        isPointerDown = false;
        textLayerEnds.forEach(resetTextLayerSelection);
      }, { signal });
      window.addEventListener("blur", () => {
        isPointerDown = false;
        textLayerEnds.forEach(resetTextLayerSelection);
      }, { signal });
      document.addEventListener("keyup", () => {
        if (!isPointerDown) textLayerEnds.forEach(resetTextLayerSelection);
      }, { signal });

      document.addEventListener("selectionchange", () => {
        const selection = document.getSelection();
        if (!selection || selection.rangeCount === 0) {
          textLayerEnds.forEach(resetTextLayerSelection);
          prevRange = null;
          return;
        }

        const active = new Set();
        for (let i = 0; i < selection.rangeCount; i++) {
          const range = selection.getRangeAt(i);
          for (const textLayerDiv of textLayerEnds.keys()) {
            if (!active.has(textLayerDiv) && range.intersectsNode(textLayerDiv)) {
              active.add(textLayerDiv);
            }
          }
        }
        for (const [textLayerDiv, endDiv] of textLayerEnds) {
          if (active.has(textLayerDiv)) textLayerDiv.classList.add("selecting");
          else resetTextLayerSelection(endDiv, textLayerDiv);
        }

        // Chrome-only: park .endOfContent beside the active selection edge so
        // dragging into empty space does not select the whole page.
        if (isFirefox === undefined) {
          isFirefox = /firefox/i.test(navigator.userAgent);
        }
        if (isFirefox) return;

        const range = selection.getRangeAt(0);
        const modifyStart = prevRange && (
          range.compareBoundaryPoints(Range.END_TO_END, prevRange) === 0 ||
          range.compareBoundaryPoints(Range.START_TO_END, prevRange) === 0
        );
        let anchor = modifyStart ? range.startContainer : range.endContainer;
        if (anchor.nodeType === Node.TEXT_NODE) anchor = anchor.parentNode;

        // If the caret sits at the start of a node, walk back to the previous
        // glyph span (mozilla/pdf.js#19785) so endOfContent is not one node too far.
        if (
          !modifyStart &&
          anchor.nodeType === Node.ELEMENT_NODE &&
          range.endOffset === 0
        ) {
          let prev = anchor.previousSibling;
          while (
            prev &&
            (prev.nodeType !== Node.ELEMENT_NODE ||
              prev.classList?.contains("endOfContent") ||
              (prev.tagName === "SPAN" && !prev.textContent))
          ) {
            prev = prev.previousSibling;
          }
          if (prev) anchor = prev;
        }

        const parentTextLayer = anchor.parentElement?.closest(".textLayer");
        const endDiv = textLayerEnds.get(parentTextLayer);
        if (endDiv && parentTextLayer && anchor.parentElement) {
          endDiv.style.width = parentTextLayer.style.width;
          endDiv.style.height = parentTextLayer.style.height;
          anchor.parentElement.insertBefore(
            endDiv,
            modifyStart ? anchor : anchor.nextSibling
          );
        }
        prevRange = range.cloneRange();
      }, { signal });
    }

    function bindTextLayerSelection(textLayerDiv) {
      const endOfContent = document.createElement("div");
      endOfContent.className = "endOfContent";
      textLayerDiv.append(endOfContent);
      textLayerEnds.set(textLayerDiv, endOfContent);
      enableTextLayerSelection();

      /** @type {DOMRect | null} */
      let selectOrigin = null;

      const glyphSpans = () =>
        [...textLayerDiv.querySelectorAll("span")].filter(
          (span) =>
            !span.classList.contains("markedContent") &&
            !span.querySelector("span") &&
            span.textContent
        );

      function resetSpanPointerEvents() {
        for (const span of glyphSpans()) span.style.pointerEvents = "";
      }

      /**
       * Two-column PDFs: DOM order is left column then right. Hitting a
       * sidebar span while dragging selects everything in between. Keep
       * pointer events only on the column where the drag started.
       */
      function constrainSpanPointerEvents(clientY) {
        if (!selectOrigin) return;
        const pageRect = textLayerDiv.getBoundingClientRect();
        const midX = pageRect.left + pageRect.width * 0.55;
        const originLeft = selectOrigin.left < midX;
        const yMin = Math.min(selectOrigin.top, clientY) - 12;
        const yMax = Math.max(selectOrigin.bottom, clientY) + 12;

        for (const span of glyphSpans()) {
          const r = span.getBoundingClientRect();
          const sameColumn = r.left < midX === originLeft;
          const inYBand = r.bottom >= yMin && r.top <= yMax;
          span.style.pointerEvents = sameColumn && inYBand ? "auto" : "none";
        }
      }

      textLayerDiv.addEventListener("mousedown", (event) => {
        textLayerDiv.classList.add("selecting");
        const span = event.target?.closest?.("span");
        selectOrigin = span ? span.getBoundingClientRect() : null;
        if (selectOrigin) constrainSpanPointerEvents(event.clientY);
      });

      textLayerDiv.addEventListener("mousemove", (event) => {
        if (!textLayerDiv.classList.contains("selecting") || !selectOrigin) return;
        constrainSpanPointerEvents(event.clientY);
      });

      const endDrag = () => {
        selectOrigin = null;
        resetSpanPointerEvents();
      };
      // pointerup/blur already reset via enableTextLayerSelection; also clear origin.
      document.addEventListener("pointerup", endDrag, { signal: textLayerSelectionAbort.signal });
      window.addEventListener("blur", endDrag, { signal: textLayerSelectionAbort.signal });

      // No <br> EOLs in the layer (they paint Chrome’s empty line-start bars).
      // Rebuild newlines on copy from vertical gaps between spans.
      textLayerDiv.addEventListener("copy", (event) => {
        const selection = document.getSelection();
        if (!selection || selection.rangeCount === 0) return;
        const range = selection.getRangeAt(0);
        const spans = [...textLayerDiv.querySelectorAll("span")].filter(
          (span) =>
            !span.classList.contains("markedContent") &&
            !span.querySelector("span") &&
            span.textContent &&
            range.intersectsNode(span)
        );
        if (!spans.length) return;

        const parts = [];
        let prevBottom = null;
        for (const span of spans) {
          const rect = span.getBoundingClientRect();
          if (prevBottom !== null && rect.top - prevBottom > rect.height * 0.4) {
            parts.push("\n");
          }
          const textNode = span.firstChild;
          if (
            textNode?.nodeType === Node.TEXT_NODE &&
            span.contains(range.startContainer) &&
            span.contains(range.endContainer)
          ) {
            const start =
              range.startContainer === textNode ? range.startOffset : 0;
            const end =
              range.endContainer === textNode
                ? range.endOffset
                : textNode.textContent.length;
            parts.push(textNode.textContent.slice(start, end));
          } else if (
            textNode?.nodeType === Node.TEXT_NODE &&
            span.contains(range.startContainer)
          ) {
            const start =
              range.startContainer === textNode ? range.startOffset : 0;
            parts.push(textNode.textContent.slice(start));
          } else if (
            textNode?.nodeType === Node.TEXT_NODE &&
            span.contains(range.endContainer)
          ) {
            const end =
              range.endContainer === textNode
                ? range.endOffset
                : textNode.textContent.length;
            parts.push(textNode.textContent.slice(0, end));
          } else {
            parts.push(span.textContent);
          }
          prevBottom = rect.bottom;
        }

        event.clipboardData.setData("text/plain", parts.join(""));
        event.preventDefault();
        event.stopPropagation();
      });
    }

    /** Drop empty EOL markers so pdf.js does not emit selectable <br> nodes. */
    function textContentWithoutBreaks(textContent) {
      return {
        ...textContent,
        items: textContent.items
          .filter((item) => item.str === undefined || item.str !== "")
          .map((item) =>
            item.str === undefined ? item : { ...item, hasEOL: false }
          ),
      };
    }

    function clearTextLayerSelection() {
      textLayerEnds.clear();
      textLayerSelectionAbort?.abort();
      textLayerSelectionAbort = null;
    }

    async function renderPdfs(rootEl) {
      const hosts = [...rootEl.querySelectorAll(".cv-pdf[data-pdf]")];
      if (!hosts.length) return;

      clearTextLayerSelection();

      let pdfjs;
      try {
        pdfjs = await loadPdfjs();
      } catch (err) {
        console.error("pdf.js failed to load", err);
        for (const host of hosts) {
          const el = document.createElement("p");
          el.className = "cv-pdf-status";
          el.textContent = "Could not load PDF viewer.";
          host.replaceChildren(el);
        }
        return;
      }

      await Promise.all(
        hosts.map(async (host) => {
          const url = host.getAttribute("data-pdf");
          if (!url || url.startsWith(ASSET_PREFIX)) return;

          host.setAttribute("aria-busy", "true");
          const status = document.createElement("p");
          status.className = "cv-pdf-status";
          status.textContent = "Loading…";
          host.replaceChildren(status);

          try {
            const doc = await pdfjs.getDocument(url).promise;
            const cssWidth =
              host.clientWidth || Math.min(window.innerWidth - 32, 832);
            const maxCanvasPixels = 33554432;
            const pages = [];

            for (let i = 1; i <= doc.numPages; i++) {
              const page = await doc.getPage(i);
              const base = page.getViewport({ scale: 1 });
              const scale = cssWidth / base.width;
              const viewport = page.getViewport({ scale });

              let sx = Math.max(window.devicePixelRatio || 1, PDF_OUTPUT_SCALE);
              const maxScale = Math.sqrt(
                maxCanvasPixels / (viewport.width * viewport.height)
              );
              if (sx > maxScale) sx = maxScale;

              const pageDiv = document.createElement("div");
              pageDiv.className = "cv-pdf-page";
              pageDiv.style.setProperty("--scale-factor", String(viewport.scale));
              pdfjs.setLayerDimensions(pageDiv, viewport);

              const canvas = document.createElement("canvas");
              const ctx = canvas.getContext("2d", { alpha: false });
              const canvasWidth = Math.floor(viewport.width * sx);
              const canvasHeight = Math.floor(viewport.height * sx);
              canvas.width = canvasWidth;
              canvas.height = canvasHeight;

              const transform = [
                canvasWidth / viewport.width,
                0,
                0,
                canvasHeight / viewport.height,
                0,
                0,
              ];
              await page.render({
                canvasContext: ctx,
                viewport,
                transform,
                intent: "print",
              }).promise;

              const textContent = textContentWithoutBreaks(
                await page.getTextContent({
                  includeMarkedContent: true,
                  disableNormalization: true,
                })
              );

              const textLayerDiv = document.createElement("div");
              textLayerDiv.className = "textLayer";
              pageDiv.append(canvas, textLayerDiv);

              const textLayer = new pdfjs.TextLayer({
                textContentSource: textContent,
                container: textLayerDiv,
                viewport,
              });
              await textLayer.render();
              bindTextLayerSelection(textLayerDiv);

              pages.push(pageDiv);
            }

            host.replaceChildren(...pages);
          } catch (err) {
            console.error("pdf render failed", err);
            const errEl = document.createElement("p");
            errEl.className = "cv-pdf-status";
            errEl.textContent = "Could not render PDF.";
            host.replaceChildren(errEl);
          } finally {
            host.removeAttribute("aria-busy");
          }
        })
      );
    }

    async function tryUnlock(password) {
      const payload = await payloadPromise;
      if (payload.v !== 2 || !payload.html) throw new Error("unsupported payload");

      const salt = b64ToBytes(payload.salt);
      const key = await deriveKey(password, salt, payload.iter);

      const htmlBytes = await decryptBytes(
        key,
        payload.html.iv,
        b64ToBytes(payload.html.ciphertext)
      );
      const html = new TextDecoder().decode(htmlBytes);

      revokeBlobs();
      const assets = payload.assets || {};
      await Promise.all(
        Object.entries(assets).map(async ([name, meta]) => {
          const res = await fetch(`/cv/${meta.file}`);
          if (!res.ok) throw new Error(`asset missing: ${name}`);
          const buf = await res.arrayBuffer();
          const plain = await decryptBytes(key, meta.iv, buf);
          const url = URL.createObjectURL(
            new Blob([plain], { type: meta.mime || "application/octet-stream" })
          );
          blobUrls.set(name, url);
        })
      );

      sessionStorage.setItem(SESSION_KEY, password);
      content.innerHTML = html;
      rewriteAssetRefs(content);
      content.hidden = false;
      gate.hidden = true;
      document.title = "CV — phil";
      await renderPdfs(content);
    }

    gate.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const password = passwordInput.value;
      try {
        await tryUnlock(password);
      } catch {
        errorEl.textContent = "Wrong password.";
        passwordInput.select();
      }
    });

    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
      tryUnlock(saved).catch(() => {
        sessionStorage.removeItem(SESSION_KEY);
      });
    }
  </script>
</body>
</html>
